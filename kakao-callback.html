<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>검수 카톡 연결</title><style>body{font:18px system-ui;background:#141b3a;color:#f6f1df;margin:0;padding:12vh 8vw;line-height:1.8}main{max-width:650px;margin:auto}h1{color:#6de1d2}</style><main><h1>검수 카톡 연결</h1><p id="status">카카오 인증 결과를 확인하고 있습니다.</p><p>이 창을 그대로 두고 연결 작업을 이어가 주세요. 인증값을 복사하거나 채팅으로 보내지 마세요.</p><p>카톡에는 검수 후보와 링크만 전송되며, 최종 승인은 GitHub에서 직접 진행합니다.</p></main><script>const q=new URLSearchParams(location.search);document.getElementById('status').textContent=q.has('code')?'카카오 동의가 완료되었습니다. 연결을 마무리하고 있습니다.':q.has('error')?'카카오 연결이 승인되지 않았습니다. 채팅에서 알려주세요.':'인증 결과를 기다리고 있습니다.';</script></html>
